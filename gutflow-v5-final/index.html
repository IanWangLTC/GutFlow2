<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GutFlow" />
    <title>GutFlow</title>
    <style>.__kimi-agent-container__,[class*="kimi-agent"],[id*="kimi-agent"]{display:none!important;opacity:0!important;visibility:hidden!important}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>(function(){var h=function(){var e=document.querySelectorAll('.__kimi-agent-container__,[class*="kimi-agent"],[id*="kimi-agent"]');e.forEach(function(el){el.style.display='none';el.style.opacity='0';el.style.visibility='hidden';});};setInterval(h,500);h();})();</script>
  </body>
</html>
